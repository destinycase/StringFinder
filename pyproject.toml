[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "string-finder"
version = "3.6.0"
authors = [{ name = "N2", email = "your@email.com" }]

description = "Production-ready high-performance string search utility with multiprocessing, mmap, and lazy loading optimizations."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["search", "string-finder", "mmap", "multiprocessing", "performance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities",
]

dependencies = [
    "PySide6>=6.6.0",
    "pyqtdarktheme>=2.1.0",
    "chardet>=5.2.0",
    "python-calamine>=0.1.7",
    "keyboard>=0.13.5",
    "openpyxl>=3.1.2",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
