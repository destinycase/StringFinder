[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "string-finder"
version = "1.0.0"
authors = [{ name = "N2", email = "your@email.com" }]

description = "A high-performance string search utility with Everything SDK and Multiprocessing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "pyqtdarktheme>=2.1.0",
    "chardet>=5.2.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
