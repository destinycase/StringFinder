[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "string-finder"
version = "5.8.2"
authors = [{ name = "N2", email = "your@email.com" }]

description = "Production-ready high-performance string search utility with Rust engine, multiprocessing, and smart file scanning. Features UTF-16LE support, robust session management, and comprehensive error handling."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["search", "string-finder", "mmap", "multiprocessing", "performance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities",
]

dependencies = [
    "PySide6>=6.6.0",
    "pyqtdarktheme>=0.1.7",
    "python-calamine>=0.1.7",
    "psutil>=5.9.0",
]

[project.gui-scripts]
string-finder = "sf_main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.4.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.3.0",
    "maturin>=1.5.0",
    "mypy>=1.8.0",
    "openpyxl>=3.1.2",  # 테스트 데이터 생성용 (런타임 의존성 아님)
    "Pillow>=10.0.0",  # build.py 아이콘 변환용
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -m \"not stress and not chaos\""
markers = [
    "integration: tests that exercise the deployed Rust engine and real worker pools",
    "stress: high-volume or long-running stress/load tests",
    "chaos: race-condition and rapid start/stop chaos tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 점진적 도입
check_untyped_defs = true
ignore_missing_imports = true
