<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 배경 (부드러운 라운드 사각형) -->
    <rect width="256" height="256" rx="48" fill="#FF9800"/>
    
    <!-- 장식용 그라데이션 효과 (옵션) -->
    <rect width="256" height="256" rx="48" fill="url(#paint0_linear)" fill-opacity="0.2"/>
    
    <!-- 문자열(라인) 형상화 -->
    <rect x="50" y="80" width="100" height="12" rx="6" fill="white" fill-opacity="0.8"/>
    <rect x="50" y="110" width="140" height="12" rx="6" fill="white" fill-opacity="0.8"/>
    <rect x="50" y="140" width="120" height="12" rx="6" fill="white" fill-opacity="0.8"/>
    <rect x="50" y="170" width="80" height="12" rx="6" fill="white" fill-opacity="0.8"/>
    
    <!-- 돋보기 (Search 상징) -->
    <circle cx="160" cy="140" r="45" stroke="white" stroke-width="18"/>
    <line x1="192" y1="172" x2="220" y2="200" stroke="white" stroke-width="18" stroke-linecap="round"/>
    
    <defs>
        <linearGradient id="paint0_linear" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
            <stop stop-color="white"/>
            <stop offset="1" stop-color="black"/>
        </linearGradient>
    </defs>
</svg>
