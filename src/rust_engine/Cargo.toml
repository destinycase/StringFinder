[package]
name = "sf_engine"
version = "5.8.7"
edition = "2021"

[dependencies]
pyo3 = { version = "0.23.0", features = ["extension-module"] }
aho-corasick = "1.1"
memchr = "2.7"
memmap2 = "0.9.0"
encoding_rs = "0.8.33"
ignore = "0.4"
rayon = "1.8"
simdutf8 = "0.1"
calamine = "0.33"
crossbeam-channel = "0.5"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = "1.0"
quick-xml = "0.31"
unicode-normalization = "0.1"
fs2 = "0.4"
globset = "0.4"

[lib]
name = "sf_engine"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
opt-level = 3
